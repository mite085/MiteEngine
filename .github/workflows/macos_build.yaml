# .github/workflows/macos_build.yaml
name: macOS Build and Test

on: [push, pull_request]

jobs:
  macos-build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code with submodules
      uses: actions/checkout@v3
      with:
        submodules: recursive
        fetch-depth: 0
    
    - name: Install Homebrew dependencies
      run: |
        # 安装 Homebrew 如果尚未安装
        if ! command -v brew &> /dev/null; then
          /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          echo 'eval "$(/opt/homebrew/bin/brew shellenv)"' >> ~/.zprofile
          eval "$(/opt/homebrew/bin/brew shellenv)"
        fi
        
        # 更新 Homebrew
        brew update
        
        # 安装基础构建工具
        brew install cmake ninja pkg-config
        
        # 安装图形库依赖
        brew install glfw3 glew
        
        # 验证安装
        echo "=== Installed tool versions ==="
        cmake --version
        ninja --version
        clang --version
        pkg-config --version
        
        # 验证 GLFW 安装
        if pkg-config --exists glfw3; then
          echo "✓ GLFW3 is available via pkg-config"
          pkg-config --modversion glfw3
        fi
    
    - name: Configure with CMake (with Objective-C++ support)
      run: |
        # 清理旧构建
        if [ -d "build" ]; then
          rm -rf build
        fi
        
        mkdir -p build
        cd build
        
        echo "=== Configuring CMake ==="
        
        # 首先检查 CMake 是否能找到 Objective-C++ 编译器
        echo "Checking Objective-C++ compiler..."
        if ! command -v clang++ &> /dev/null; then
          echo "clang++ not found, installing Xcode command line tools..."
          xcode-select --install || true
        fi
        
        # 设置 Objective-C++ 编译器
        export CC=clang
        export CXX=clang++
        
        # 对于 Objective-C++，我们需要设置 OBJCXX
        export OBJCXX=clang++
        
        # macOS 特定的 CMake 配置
        # 关键：启用 Objective-C++ 语言支持
        cmake -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
          -DCMAKE_CXX_STANDARD=17 \
          -DCMAKE_C_COMPILER=clang \
          -DCMAKE_CXX_COMPILER=clang++ \
          -DCMAKE_OBJC_COMPILER=clang \
          -DCMAKE_OBJCXX_COMPILER=clang++ \
          -DCMAKE_XCODE_ATTRIBUTE_CLANG_CXX_LANGUAGE_STANDARD="c++17" \
          -DCMAKE_XCODE_ATTRIBUTE_CLANG_CXX_LIBRARY="libc++" \
          ..
        
        if [ $? -ne 0 ]; then
          echo "CMake configuration failed, trying alternative approach..."
          
          # 尝试使用 Xcode 生成器
          cmake -G "Xcode" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DCMAKE_CXX_STANDARD=17 \
            ..
            
          if [ $? -ne 0 ]; then
            echo "Both CMake configurations failed"
            exit 1
          fi
          
          echo "✓ CMake configuration successful with Xcode generator"
        else
          echo "✓ CMake configuration successful with Ninja generator"
        fi
    
    - name: Build project
      run: |
        cd build
        
        echo "=== Building project ==="
        
        # 获取 CPU 核心数
        CPU_CORES=$(sysctl -n hw.ncpu)
        echo "Using $CPU_CORES CPU cores"
        
        # 检查使用的是哪个生成器
        if [ -f "project.xcworkspace" ] || [ -f "*.xcodeproj" ]; then
          echo "Using Xcode build system"
          
          # 使用 xcodebuild 构建
          if command -v xcodebuild &> /dev/null; then
            xcodebuild -configuration Release -jobs $CPU_CORES
          else
            echo "xcodebuild not found, trying cmake --build"
            cmake --build . --config Release --parallel $CPU_CORES
          fi
        else
          echo "Using Ninja build system"
          
          # 使用 Ninja 构建
          ninja -j $CPU_CORES
        fi
        
        if [ $? -ne 0 ]; then
          echo "Build failed"
          exit 1
        fi
        
        echo "✓ Build successful"
        
        # 显示构建产物
        echo "=== Build artifacts ==="
        find . -name "*.dylib" -o -name "*.so" -o -name "*.framework" -o -name "*test*" -type f -perm +111 2>/dev/null | while read file; do
          if [ -x "$file" ]; then
            size_kb=$(($(stat -f%z "$file" 2>/dev/null || echo 0) / 1024))
            echo "  $(basename "$file") - ${size_kb} KB"
          fi
        done
    
    - name: Run tests
      run: |
        cd build
        
        echo "=== Running tests ==="
        
        # 查找所有可执行测试文件
        test_files=$(find . -name "*test*" -type f -perm +111 2>/dev/null)
        
        if [ -z "$test_files" ]; then
          echo "No test executables found"
          echo "Checking for test bundles..."
          
          # 也可能是 .xctest 包
          test_bundles=$(find . -name "*.xctest" -type d)
          if [ -n "$test_bundles" ]; then
            echo "Found XCTest bundles:"
            echo "$test_bundles"
            
            # 运行 XCTest 包
            for bundle in $test_bundles; do
              echo "Running test bundle: $(basename "$bundle")"
              xcrun xctest "$bundle" 2>/dev/null || true
            done
          fi
        else
          echo "Found $(echo "$test_files" | wc -l) test file(s)"
          
          # 运行每个测试
          passed=0
          failed=0
          
          while IFS= read -r test_file; do
            if [ -x "$test_file" ]; then
              echo "Running test: $(basename "$test_file")"
              
              # 设置动态库路径
              export DYLD_LIBRARY_PATH="$(dirname "$test_file"):$DYLD_LIBRARY_PATH"
              export DYLD_FRAMEWORK_PATH="$(dirname "$test_file"):$DYLD_FRAMEWORK_PATH"
              
              # 运行测试
              "$test_file" || true
              test_exit_code=$?
              
              if [ $test_exit_code -eq 0 ]; then
                echo "  ✓ Test passed"
                ((passed++))
              else
                echo "  ✗ Test failed with exit code: $test_exit_code"
                ((failed++))
              fi
            fi
          done <<< "$test_files"
          
          echo ""
          echo "=== Test Summary ==="
          echo "Passed: $passed"
          echo "Failed: $failed"
          
          if [ $failed -gt 0 ]; then
            echo "Some tests failed"
            exit 1
          else
            echo "✓ All tests passed"
          fi
        fi
