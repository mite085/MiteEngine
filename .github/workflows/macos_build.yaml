# .github/workflows/macos_build.yaml
name: macOS Build and Test

on: [push, pull_request]

jobs:
  macos-build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        submodules: recursive
    
    - name: Setup Xcode
      run: |
        # 确保使用正确的 Xcode 版本
        sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
        xcodebuild -version
        
        # 获取编译器路径
        echo "Clang path: $(xcrun -f clang)"
        echo "Clang++ path: $(xcrun -f clang++)"
    
    - name: Install dependencies
      run: |
        # 安装 CMake 和 Ninja
        brew install cmake ninja
        
        # 验证工具版本
        cmake --version
        ninja --version
    
    - name: Configure with CMake
      run: |
        # 清理并创建构建目录
        rm -rf build
        mkdir -p build
        cd build
        
        echo "=== Configuring CMake ==="
        
        # 使用 xcrun 获取完整的编译器路径
        CLANG_PATH=$(xcrun -f clang)
        CLANGXX_PATH=$(xcrun -f clang++)
        
        # 配置 CMake 明确指定编译器路径
        cmake -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
          -DCMAKE_C_COMPILER="$CLANG_PATH" \
          -DCMAKE_CXX_COMPILER="$CLANGXX_PATH" \
          -DCMAKE_OBJC_COMPILER="$CLANG_PATH" \
          -DCMAKE_OBJCXX_COMPILER="$CLANGXX_PATH" \
          -DGLFW_BUILD_DOCS=OFF \
          -DGLFW_BUILD_TESTS=OFF \
          -DGLFW_BUILD_EXAMPLES=OFF \
          ..
        
        if [ $? -ne 0 ]; then
          echo "CMake configuration failed"
          exit 1
        fi
        
        echo "✓ CMake configuration successful"
    
    - name: Build project
      run: |
        cd build
        
        echo "=== Building project ==="
        
        # 获取 CPU 核心数并构建
        CPU_CORES=$(sysctl -n hw.ncpu)
        echo "Using $CPU_CORES CPU cores"
        
        ninja -j $CPU_CORES
        
        if [ $? -ne 0 ]; then
          echo "Build failed"
          exit 1
        fi
        
        echo "✓ Build successful"
    
    - name: Run tests
      run: |
        cd build
        
        echo "=== Running tests ==="
        
        # 查找并运行测试
        find . -name "*test*" -type f -perm +111 | while read test_file; do
          if [ -x "$test_file" ]; then
            echo "Running test: $(basename "$test_file")"
            
            # 设置动态库路径
            export DYLD_LIBRARY_PATH="$(dirname "$test_file"):$DYLD_LIBRARY_PATH"
            
            # 运行测试
            if "$test_file"; then
              echo "  ✓ Test passed"
            else
              echo "  ✗ Test failed"
              exit 1
            fi
          fi
        done
        
        echo "✓ All tests passed"
