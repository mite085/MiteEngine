name: Code Format Check

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main ]

jobs:
  clang-format:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Setup clang-format
      uses: DoozyX/clang-format-lint-action@v0.17
      with:
        source: 'src'
        clangFormatVersion: 14
        style: 'file'  # 使用项目中的 .clang-format 文件
        inplace: false  # 只检查，不修改
    
    - name: Show formatting issues
      if: failure()
      run: |
        echo "Formatting issues found. To fix locally:"
        echo ""
        echo "On Linux/macOS:"
        echo "  find src -name '*.cpp' -o -name '*.hpp' -o -name '*.h' | xargs clang-format-14 -i"
        echo ""
        echo "On Windows:"
        echo "  Get-ChildItem src -Recurse -Include *.cpp,*.hpp,*.h | ForEach-Object { clang-format -i $_ }"
