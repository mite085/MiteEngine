# .github/workflows/ubuntu_release.yaml
name: Linux Release

on:
  push:
    tags:
      - 'v*'

jobs:
  linux-release:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
      with:
        submodules: recursive
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build build-essential
        sudo apt-get install -y libgl1-mesa-dev libx11-dev libxrandr-dev libxi-dev
    
    - name: Build
      run: |
        mkdir build && cd build
        cmake -G Ninja -DCMAKE_BUILD_TYPE=Release ..
        ninja -j$(nproc)
    
    - name: Package
      run: |
        exe_dir="build/src/main"
        tar -czf "MiteEngine-Linux-x64.tar.gz" \
          -C "$exe_dir" \
          MiteEngine assets imgui.ini mite_ubuntu.sh
    
    - uses: softprops/action-gh-release@v1
      with:
        files: MiteEngine-Linux-x64.tar.gz
