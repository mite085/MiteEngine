name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  release:
    types: [created]

env:
  BUILD_TYPE: Release
  CMAKE_GENERATOR: Ninja

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        build_type: [Release, Debug]
        exclude:
          # 在macOS上只构建Release版本以节省时间
          - os: macos-latest
            build_type: Debug
        include:
          # Windows使用MSVC
          - os: windows-latest
            generator: "Visual Studio 17 2022"
            arch: "x64"
          # Linux和macOS使用Ninja
          - os: ubuntu-latest
            generator: "Ninja"
          - os: macos-latest
            generator: "Ninja"

    runs-on: ${{ matrix.os }}
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Setup Python (for Shaderc dependencies)
      uses: actions/setup-python@v6
      with:
        python-version: '3.x'

    - name: Install system dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          ninja-build \
          libgl1-mesa-dev \
          libglu1-mesa-dev \
          xorg-dev \
          libx11-dev \
          libxrandr-dev \
          libxinerama-dev \
          libxcursor-dev \
          libxi-dev
        # 安装Vulkan开发包（可选）
        sudo apt-get install -y libvulkan-dev

    - name: Install system dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        brew update
        brew install cmake ninja pkg-config
        # 安装Xcode命令行工具（如果未安装）
        xcode-select --install || true

    - name: Install system dependencies (Windows)
      if: runner.os == 'Windows'
      run: |
        choco install ninja -y

    - name: Configure CMake
      run: |
        cmake -B ${{github.workspace}}/build \
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
          -DBUILD_TESTS=ON \
          -DBUILD_SHARED_LIBS=OFF \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
          -G "${{ matrix.generator || env.CMAKE_GENERATOR }}" \
          ${{ matrix.arch && format('-A {0}', matrix.arch) || '' }}

    - name: Build
      run: |
        cmake --build ${{github.workspace}}/build --config ${{ matrix.build_type }} --parallel

    - name: Run tests (if any)
      if: matrix.build_type == 'Debug' && runner.os != 'macOS'  # 通常在Debug模式下运行测试
      working-directory: ${{github.workspace}}/build
      run: |
        if [ -f "CTestTestfile.cmake" ]; then
          ctest --output-on-failure -C ${{ matrix.build_type }}
        else
          echo "No tests found"
        fi

    - name: Upload build artifacts
      if: matrix.build_type == 'Release' && runner.os == 'Windows'
      uses: actions/upload-artifact@v6
      with:
        name: MiteEngine-Windows-${{ github.sha }}
        path: |
          ${{github.workspace}}/build/bin/Release/*.exe
          ${{github.workspace}}/build/bin/Release/*.dll
        retention-days: 7

    - name: Upload build artifacts (Linux)
      if: matrix.build_type == 'Release' && runner.os == 'Linux'
      uses: actions/upload-artifact@v6
      with:
        name: MiteEngine-Linux-${{ github.sha }}
        path: ${{github.workspace}}/build/bin/*
        retention-days: 7

    - name: Upload build artifacts (macOS)
      if: matrix.build_type == 'Release' && runner.os == 'macOS'
      uses: actions/upload-artifact@v6
      with:
        name: MiteEngine-macOS-${{ github.sha }}
        path: ${{github.workspace}}/build/bin/*
        retention-days: 7

  create-release:
    needs: build-and-test
    if: github.event_name == 'release' && github.event.action == 'created'
    runs-on: ubuntu-latest
    
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v7
      with:
        path: artifacts

    - name: Create release assets
      run: |
        # 创建发布包
        mkdir -p release_packages
        
        # Windows
        if [ -d "artifacts/MiteEngine-Windows-${{ github.sha }}" ]; then
          cd "artifacts/MiteEngine-Windows-${{ github.sha }}"
          zip -r ../../release_packages/MiteEngine-Windows-${{ github.event.release.tag_name }}.zip .
          cd ../..
        fi
        
        # Linux
        if [ -d "artifacts/MiteEngine-Linux-${{ github.sha }}" ]; then
          cd "artifacts/MiteEngine-Linux-${{ github.sha }}"
          tar -czf ../../release_packages/MiteEngine-Linux-${{ github.event.release.tag_name }}.tar.gz .
          cd ../..
        fi
        
        # macOS
        if [ -d "artifacts/MiteEngine-macOS-${{ github.sha }}" ]; then
          cd "artifacts/MiteEngine-macOS-${{ github.sha }}"
          tar -czf ../../release_packages/MiteEngine-macOS-${{ github.event.release.tag_name }}.tar.gz .
          cd ../..
        fi

    - name: Upload release assets
      uses: softprops/action-gh-release@v2
      with:
        files: release_packages/*
        tag_name: ${{ github.event.release.tag_name }}

  code-quality:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Run clang-format check
      run: |
        # 安装clang-format
        sudo apt-get update
        sudo apt-get install -y clang-format-14
        
        # 检查代码格式
        find src -name "*.cpp" -o -name "*.hpp" -o -name "*.h" | \
          xargs clang-format-14 --dry-run --Werror
        
        echo "Code formatting check passed"

    - name: Run cppcheck
      run: |
        sudo apt-get install -y cppcheck
        cppcheck --enable=all --suppress=missingIncludeSystem \
          --suppress=unmatchedSuppression \
          -I src -I thirdparty \
          --error-exitcode=1 \
          src/

  dependency-check:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Check CMake configuration
      run: |
        mkdir -p build-check
        cd build-check
        cmake .. -DBUILD_TESTS=ON -DBUILD_SHARED_LIBS=OFF
        echo "CMake configuration successful"
        
        # 检查关键依赖
        echo "Checking for required dependencies..."
        if ! grep -q "OpenGL found" CMakeCache.txt 2>/dev/null; then
          echo "WARNING: OpenGL not found in cache"
        fi
        
        # 检查Shaderc依赖同步
        if [ -f "thirdparty/shaderc/third_party/glslang/CMakeLists.txt" ]; then
          echo "✓ Shaderc dependencies are synced"
        else
          echo "✗ Shaderc dependencies need sync"
        fi
