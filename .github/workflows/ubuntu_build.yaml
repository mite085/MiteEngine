# .github/workflows/build.yml
name: Ubuntu Linux Build and Test

on: [push, pull_request]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        submodules: recursive
    
    - name: Install dependencies
      run: |
        # 更新包列表
        sudo apt-get update
        
        # 安装基础编译工具（catthehacker镜像可能没有这些）
        sudo apt-get install -y \
          cmake \
          ninja-build \
          build-essential \
          pkg-config \
          python3
        
        # 安装图形库依赖
        sudo apt-get install -y \
          libgl1-mesa-dev \
          libglu1-mesa-dev \
          libx11-dev \
          libxrandr-dev \
          libxinerama-dev \
          libxcursor-dev \
          libxi-dev \
          libwayland-dev \
          libxkbcommon-dev \
          libxkbcommon-x11-dev \
          wayland-protocols \
          zlib1g-dev
        
        # 验证工具链
        echo "=== Toolchain versions ==="
        cmake --version
        ninja --version
        g++ --version
        python3 --version
      
    - name: Configure with Ninja
      run: |
        mkdir -p build
        cd build
        cmake -G Ninja -DCMAKE_BUILD_TYPE=Release ..
      
    - name: Build with Ninja
      run: |
        cd build
        ninja -j$(nproc)
        
    - name: Run Tests
      run: |
        cd build
        # 查找所有测试可执行文件
        find . -name "*test*" -type f -executable | while read test_file; do
          echo "Running test: $test_file"
          $test_file
        done
